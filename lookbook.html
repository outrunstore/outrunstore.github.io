<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Het OUTRUN-lookbook: zo draag je de items uit de drop.">
<title>Lookbook · OUTRUN Store</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101114'/%3E%3Ctext x='33' y='47' font-family='Arial Black,Arial' font-weight='900' font-style='italic' font-size='42' text-anchor='middle' fill='%232436F5'%3EO%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
</head>
<body data-page="lookbook">
<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Lookbook</span></div>
      <h1>Lookbook</h1>
      <p id="lookIntro"></p>
    </div>
  </section>

  <div class="wrap looks" id="looks"></div>
</main>

<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script>
$("lookIntro").textContent = `Zo draag je ${CONFIG.dropName}. Klik op een item om het te shoppen.`;
$("looks").innerHTML = LOOKS.map((l, i) => {
  const items = l.products.map(productById).filter(Boolean);
  return `<figure class="look" style="margin:0 0 20px">
    <img src="${l.img}" alt="Look ${i + 1}: ${esc(l.title)}" loading="${i < 3 ? "eager" : "lazy"}">
    <figcaption>
      <span class="eyebrow" style="color:#fff;opacity:.8">Look ${String(i + 1).padStart(2, "0")}</span>
      <b>${esc(l.title)}</b>
      <span class="look-links">${items.map(p => `<a href="${productUrl(p)}">${esc(p.name)} · ${isSoldOut(p) ? "uitverkocht" : euro(p.price)}</a>`).join("")}</span>
    </figcaption>
  </figure>`;
}).join("");
</script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script src="assets/motion.js"></script>
<script src="assets/chatbot.js"></script>
</body>
</html>
